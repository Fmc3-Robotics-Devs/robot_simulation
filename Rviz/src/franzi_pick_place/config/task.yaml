# Machine-tending cell layout and task parameters.
#
# All lengths are metres in the `world` frame, which coincides with `base_link`.
# The floor sits at z = -0.0873 (wheel contact), so a table top at z = 0.80 is
# 0.887 m above the ground.

pick_place_task:
  ros__parameters:
    frame_id: "world"

    # --- robot interfaces ------------------------------------------------
    arm_group: "left_arm"
    body_group: "body"
    head_group: "head"
    park_group: "both_arms"
    body_posture: "work"
    head_posture: "home"
    park_posture: "off_arms"
    tip_link: "left_wrist_roll_Link"
    attach_link: "left_wrist_roll_Link"
    touch_links:
      - "leftfinger1_Link"
      - "leftfinger2_Link"
      - "left_wrist_roll_Link"
      - "left_wrist_d405_Link"

    # --- gripper ---------------------------------------------------------
    gripper_controller: "left_gripper_controller"
    gripper_joints: ["leftfinger1_joint", "leftfinger2_joint"]
    # The jaws are 95 mm apart at joint zero and close towards each other.
    gripper_gap_at_zero: 0.095
    gripper_max_stroke: 0.0475
    gripper_open_gap: 0.085
    grasp_squeeze: 0.002

    # --- grasp -----------------------------------------------------------
    # Grasp centre between the finger pads, expressed in the tip link frame.
    tcp_offset: [-0.0305, -0.0018, -0.2414]
    # Grasp above the workpiece centre so the fingers clear the pocket walls.
    grasp_height_offset: 0.02
    grasp_yaw: 0.0
    approach_height: 0.12
    approach_velocity_scaling: 0.15
    ik_attempts: 25
    ik_timeout: 0.05

    # --- cell ------------------------------------------------------------
    # Station positions come from the reachability map (`ros2 run
    # franzi_pick_place reach_map`) and sit well inside the left arm's
    # collision-free envelope. Reaching across the body midline makes the upper
    # arm hit the torso, so everything stays at y >= -0.02.
    ground_z: -0.0873
    table:
      center_xy: [0.48, 0.16]
      size_xy: [0.40, 0.60]
      top_z: 0.80
      thickness: 0.03
      leg_size: 0.05
      leg_inset: 0.02

    workpiece:
      size: [0.05, 0.05, 0.09]
      pick_xy: [0.38, 0.34]

    pocket:
      center_xy: [0.42, 0.16]
      # Half-gap between the workpiece and each wall. Tight tolerances belong
      # in the physics stage; here they only make planning brittle.
      clearance: 0.012
      wall_thickness: 0.015
      wall_height: 0.03

    unload:
      center_xy: [0.38, -0.02]

    # --- machining cycle -------------------------------------------------
    machining:
      duration: 8.0
      # Set true to block until `ros2 service call
      # /machining_station/complete std_srvs/srv/Trigger {}` is issued.
      wait_for_trigger: false

    repeat: 1

    # --- reachability tool -----------------------------------------------
    reach_map:
      x_range: [0.28, 0.60]
      y_range: [-0.24, 0.42]
      step: 0.04
